# Render's free web service sleeps after 15 minutes without inbound traffic. This pings it so
# the first message after a quiet period doesn't wait ~1 minute for a cold start.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs; 5 min leaves slack under Render's 15
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the bot
        run: |
          # The webhook server answers 404 on "/": any response proves the service is awake.
          code=$(curl -s -o /dev/null -m 90 --retry 2 -w '%{http_code}' https://sub-translate-bot.onrender.com/ || echo 000)
          echo "HTTP $code"
          [ "$code" != "000" ]
